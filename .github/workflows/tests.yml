name: Source tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: source-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-tests:
    name: Source test suites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMARCHY_PATH: ${{ github.workspace }}
      OMARCHY_PKGS_PATH: ${{ github.workspace }}/dependencies/omarchy-pkgs
      OMARCHY_ISO_PATH: ${{ github.workspace }}/dependencies/omarchy-iso
    steps:
      - uses: actions/checkout@v7
      - name: Check out package contracts
        uses: actions/checkout@v7
        with:
          repository: maralcbr/omarchy-pkgs
          path: dependencies/omarchy-pkgs
          persist-credentials: false
      - name: Check out installer contracts
        uses: actions/checkout@v7
        with:
          repository: maralcbr/omarchy-iso
          path: dependencies/omarchy-iso
          persist-credentials: false
      - name: Run source suites with Arch runtime tools
        run: |
          docker run --rm --init \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e TEST_UID="$(id -u)" \
            -e OMARCHY_PATH=/src \
            -e OMARCHY_PKGS_PATH=/src/dependencies/omarchy-pkgs \
            -e OMARCHY_ISO_PATH=/src/dependencies/omarchy-iso \
            archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5 \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed git jq libarchive lua ripgrep shellcheck imagemagick gum plocate openssh nodejs npm python unzip bc
              useradd --create-home --uid "$TEST_UID" tester
              export PATH="/src/bin:$PATH"
              runuser -u tester -- bash -euo pipefail -c "./test/all && bash test/shell.d/stable-release-test.sh"
            '
